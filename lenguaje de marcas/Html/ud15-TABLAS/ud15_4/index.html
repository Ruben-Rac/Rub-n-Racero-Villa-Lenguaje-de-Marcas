<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Datos Completa</title>
</head>
<body>

    
    <table style="border-spacing: 8px; border: 2px solid #333; margin: 20px auto; background-color: #fafafa; empty-cells: hide;">
        
        
        <caption style="caption-side: bottom; font-weight: bold; margin-top: 8px;">Listado de stock y productos</caption>
        
        
        <thead>
            <tr>
                <th style="border: 1px solid #777; padding: 8px 12px; background-color: #2c3e50; color: white;">Producto</th>
                <th style="border: 1px solid #777; padding: 8px 12px; background-color: #2c3e50; color: white;">Cantidad</th>
                <th style="border: 1px solid #777; padding: 8px 12px; background-color: #2c3e50; color: white;">Precio Unidad</th>
            </tr>
        </thead>

        
        <tbody>
            <tr>
                
                <td rowspan="2" style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff; vertical-align: middle;">Portátil Gaming</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">4</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">800 €</td>
            </tr>
            <tr>
                
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;"></td> 
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">Sin stock disponible</td>
            </tr>
            <tr>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">Ratón Inalámbrico</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">15</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">25 €</td>
            </tr>
            <tr>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">Teclado Mecánico</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">10</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">60 €</td>
            </tr>
            <tr>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">Monitor 27 pulgadas</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">6</td>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #ffffff;">200 €</td>
            </tr>
        </tbody>

        
        <tfoot>
            <tr>
                <td style="border: 1px solid #777; padding: 8px 12px; background-color: #e2e8f0; font-weight: bold;">Total referencias</td>
                <td colspan="2" style="border: 1px solid #777; padding: 8px 12px; background-color: #e2e8f0; font-weight: bold;">5 productos registrados</td>
            </tr>
        </tfoot>
    </table>


</body>
</html>
