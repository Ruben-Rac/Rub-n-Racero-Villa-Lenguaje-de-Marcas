<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Precios</title>
</head>
<body>

    <table style="border-collapse: collapse; width: 60%; margin: auto; font-family: Arial, sans-serif;">
        <caption>Lista de precios de la cafetería</caption>
        
        
        <tr>
            <th colspan="3" style="border: 1px solid #333; background-color: #2c3e50; color: white; padding: 10px; text-align: center;">
                Bebidas Calientes
            </th>
        </tr>
        
        
        <tr>
            <th style="border: 1px solid #333; background-color: #ecf0f1; padding: 8px;">Producto</th>
            <th style="border: 1px solid #333; background-color: #ecf0f1; padding: 8px;">Tamaño</th>
            <th style="border: 1px solid #333; background-color: #ecf0f1; padding: 8px;">Precio</th>
        </tr>

        
        <tr style="background-color: #ffffff;">
            <td rowspan="2" style="border: 1px solid #333; padding: 8px; text-align: center; vertical-align: middle;">Café con leche</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">Normal</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">1,20 €</td>
        </tr>
        
       
        <tr style="background-color: #f9f9f9;">
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">Grande</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">1,50 €</td>
        </tr>

        
        <tr style="background-color: #ffffff;">
            <td style="border: 1px solid #333; padding: 8px;">Té matcha</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">Único</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">2,00 €</td>
        </tr>

        
        <tr style="background-color: #f9f9f9;">
            <td style="border: 1px solid #333; padding: 8px;">Infusión de manzanilla</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">Único</td>
            <td style="border: 1px solid #333; padding: 8px; text-align: center;">1,10 €</td>
        </tr>
    </table>

</body>
</html>
